[project]
name = "mta-train-board"
version = "0.1.0"
description = "A glanceable NYC subway arrivals board that polls MTA GTFS-Realtime feeds and serves them as JSON."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28.1",
    "nyct-gtfs>=2.1.0",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pip-audit>=2.7",
    "pytest>=9.1.1",
    "ruff>=0.6",
]

[tool.mypy]
python_version = "3.12"
# nyct_gtfs and its google.protobuf deps ship no type stubs; silence the
# "missing import" noise rather than vendoring stubs. This is not strict mode:
# real type errors in app/ still fail the check.
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
# pycodestyle (E), pyflakes (F), isort (I), pyupgrade (UP), flake8-bugbear (B)
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
