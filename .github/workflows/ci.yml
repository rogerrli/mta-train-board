name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install dependencies
        # --locked fails if pyproject.toml and uv.lock have drifted out of sync.
        run: uv sync --locked
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install dependencies
        run: uv sync --locked
      - name: Pytest
        run: uv run pytest -q

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install dependencies
        run: uv sync --locked
      - name: Mypy
        run: uv run mypy app

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install dependencies
        run: uv sync --locked
      - name: pip-audit
        # Audit only the runtime dependencies (not dev tooling like mypy/ruff),
        # and BLOCK on any vulnerability except the two below. nyct-gtfs pins
        # protobuf==4.25.3 exactly, so PYSEC-2026-1805/1806 are unresolvable
        # without dropping the core dependency; remove the --ignore-vuln flags
        # once nyct-gtfs relaxes its protobuf pin.
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt \
            --output-file requirements-runtime.txt
          uv run pip-audit --requirement requirements-runtime.txt \
            --ignore-vuln PYSEC-2026-1805 \
            --ignore-vuln PYSEC-2026-1806
