# Arrive-by trips (issue #27) -----------------------------------------------
#
# A trip turns the board into a decision tool: "I need to be at X by 9:00 --
# which train do I catch?" Given a destination and a target arrival time, the app
# recommends the LATEST train that still gets you there on time (so you don't
# leave earlier than you must), plus a safer earlier fallback, and says clearly
# when even the best train arrives late. Add one [[trips]] block per commute.
#
#   name         Stable id for this trip (referenced by focus mode, issue #39).
#   boarding     Station you board at. Must match a [[stations]] block above by
#                NAME -- that's where the live countdowns and walk_minutes come
#                from. Configure that station with the trip's line + direction,
#                and give it a walk_minutes (arrive-by needs it).
#   line         The single line for the whole ride (no transfers -- one line per
#                trip for now).
#   direction    "N" or "S", matching the boarding station block.
#   destination  Where you're headed, by NAME (never a raw stop ID). Must be a
#                stop served by `line`. Rebuild travel times after adding a line
#                the vendored data wasn't trimmed to: `uv run scripts/refresh-travel-times`.
#   arrive_buffer_minutes  Optional. Aim to be there this many minutes EARLY
#                (the effective target is target - buffer). Default 0.
#   [trips.target]  Recurring target arrival time (Eastern, 24h "HH:MM"), keyed by
#                weekday abbreviation (mon/tue/wed/thu/fri/sat/sun) plus an
#                optional `default`. Resolution for today: an explicit weekday key
#                wins; otherwise a *weekday* (Mon-Fri) falls back to `default`; a
#                weekend with no explicit key has NO target (the board shows no
#                recommendation). So the block below means Tue 8:45, other
#                weekdays 9:00, and nothing on weekends.

# Example: board the A uptown at Fulton St (configured above) to 59 St-Columbus
# Circle -- aim to arrive by 8:45 on Tuesdays, 9:00 the rest of the week. These
# are placeholder stations/times; swap in your own trip in config.local.toml.
[[trips]]
name = "morning-uptown"
boarding = "Fulton St"
line = "A"
direction = "N"
destination = "59 St-Columbus Circle"

[trips.target]
default = "09:00"
tue = "08:45"

# Scheduled focus mode (issue #39) --------------------------------------------
#
# By default the board is a general glance view. But for a known daily commute
# there's really only ONE train that matters in a given window. A focus rule
# dedicates the WHOLE screen to a single trip's arrive-by recommendation during a
# configured time window, hiding every other station and train -- then returns to
# the normal glance board when the window ends. Add one [[focus]] block per rule;
# with none, the board always shows the glance view (today's behavior).
#
#   trip   The [[trips]] name to focus on (above). The target arrival time is
#          owned by that trip -- a focus rule never redefines it, it just says
#          "when the board should dedicate itself to this trip".
#   days   Which weekdays the rule is active, as abbreviations (mon..sun).
#   start  Window start, Eastern 24h "HH:MM" (inclusive).
#   end    Window end, Eastern 24h "HH:MM" (exclusive). Must be after `start`;
#          a window crossing midnight isn't supported -- split it into two rules.
#
# The board re-checks the active rule on every refresh, so focus flips in/out
# right around the boundary. If two rules ever overlap, the FIRST one listed wins.

# Example: weekday mornings 08:00-09:00, focus the board on the morning-uptown A.
[[focus]]
trip = "morning-uptown"
days = ["mon", "tue", "wed", "thu", "fri"]
start = "08:00"
end = "09:00"
