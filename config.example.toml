# Example configuration for mta-train-board.
#
# Copy this file to `config.local.toml` and edit it for your setup.
# `config.local.toml` is gitignored so your personal settings stay local.
# If no `config.local.toml` exists, the app falls back to this example.

# How often the frontend should refresh the board, in seconds.
refresh_interval_seconds = 30

# Stations to watch. Add one [[stations]] block per station.
# `stop_id` is the GTFS parent stop ID from the MTA static `stops.txt`
# (station-level IDs have no direction suffix, e.g. "635", not "635N"/"635S").
# `directions` picks which platforms to show: "N" (northbound), "S" (southbound),
# or both.

[[stations]]
name = "Grand Central-42 St"
stop_id = "631"
directions = ["N", "S"]

[[stations]]
name = "14 St-Union Sq"
stop_id = "635"
directions = ["N"]
