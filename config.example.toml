# Example configuration for mta-train-board.
#
# Copy this file to `config.local.toml` and edit it for your setup.
# `config.local.toml` is gitignored so your personal settings stay local.
# If no `config.local.toml` exists, the app falls back to this example.

# How often the frontend should refresh the board, in seconds. The backend also
# polls the MTA feeds on this interval and caches the result (issue #6), so the
# API answers instantly instead of fetching live per request.
refresh_interval_seconds = 30

# How old cached data may get (seconds) before the API flags the board `stale` so
# the UI can show "data is old". Defaults to ~3x the refresh interval. During a
# feed outage the last-known board keeps being served, flagged stale past this.
stale_after_seconds = 90

# Best-case walk is this many minutes faster than a station's (worst-case)
# walk_minutes. It sets the "HURRY" band: a train arriving within this many
# minutes of your walk time is only makeable if you move fast. Default 1.
walk_best_case_delta_minutes = 1

# Stations to watch. Add one [[stations]] block per station + line-set you care
# about. You identify stations by NAME and the LINES you want -- never by raw
# GTFS stop ID. At startup the app resolves each block to concrete stop IDs from
# the vendored MTA static station data (see app/stops.py).
#
#   name        Human station name, exactly as the MTA lists it (e.g.
#               "Grand Central-42 St", "Hoyt-Schermerhorn Sts"). An unknown name
#               produces a helpful error suggesting close matches.
#   lines       The subway lines you want to see here (e.g. ["A", "C"]). Lines a
#               station serves but you omit are filtered out -- their trains
#               never show. A line the station does not serve is an error.
#   directions  Which platforms to show: "N" (northbound) and/or "S"
#               (southbound). Concrete stop IDs are the parent ID plus this
#               letter (e.g. "A41" + "N" -> "A41N").
#   walk_minutes  Optional. Worst-case minutes to walk here from home. The board
#               flags each train catchable / hurry / missed against it (see
#               walk_best_case_delta_minutes above). Omit it to leave arrivals
#               here unclassified.
#
# A single station can appear in multiple blocks when you want different lines in
# different directions (see Hoyt-Schermerhorn below); repeat the same
# walk_minutes on each block for that station.

# Hoyt-Schermerhorn Sts: A/C Manhattan-bound only...
[[stations]]
name = "Hoyt-Schermerhorn Sts"
lines = ["A", "C"]
directions = ["N"]
walk_minutes = 6

# ...and the G in both directions (the G never enters Manhattan). Same station,
# so the same walk time.
[[stations]]
name = "Hoyt-Schermerhorn Sts"
lines = ["G"]
directions = ["N", "S"]
walk_minutes = 6

# Hoyt St (2/3) -- a different station from Hoyt-Schermerhorn.
[[stations]]
name = "Hoyt St"
lines = ["2", "3"]
directions = ["N"]
walk_minutes = 4

# DeKalb Av (BMT): Q/R both ways, plus B Manhattan-bound. The lines here also
# disambiguate this DeKalb Av from the unrelated one on the L line.
[[stations]]
name = "DeKalb Av"
lines = ["Q", "R"]
directions = ["N", "S"]
walk_minutes = 5

[[stations]]
name = "DeKalb Av"
lines = ["B"]
directions = ["N"]
walk_minutes = 5

# Jay St-MetroTech: only the F Manhattan-bound. The A/C/R that also stop here are
# filtered out by omission.
[[stations]]
name = "Jay St-MetroTech"
lines = ["F"]
directions = ["N"]
walk_minutes = 3
